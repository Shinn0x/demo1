name: Deploy Website
on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Install depencies
        run: npm ci
      - name: Lint code
        run: npm run lint
      - name: Run tests
        run: npm test
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Install depencies
        run: npm ci
      - name: Build website
        run: npm run build
      - name: Upload build-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: ./dist/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build-artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: ./dist/
      - name: List what is inside the dist folder
        run: ls -la ./dist/
